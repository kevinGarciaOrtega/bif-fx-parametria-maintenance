service: bif-fx-param-mantainaice

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DYNAMO_TABLE: tablero-${self:provider.stage}
    STAGE: ${self:provider.stage}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${opt:region, 'us-east-1'}:*:table/tablero-${self:provider.stage}
            - arn:aws:dynamodb:${opt:region, 'us-east-1'}:*:table/tablero-${self:provider.stage}/index/*

# src/handlers/<name>.handler.ts  →  handler: src/handlers/<name>.handler.handler
functions:
  volatilidad:
    handler: src/handlers/volatilidad.handler.handler
    events:
      - http:
          path: 'volatilidad/{moneda}'
          method: get
      - http:
          path: volatilidad
          method: post
      - http:
          path: 'volatilidad/{moneda}/{fecha}'
          method: put
      - http:
          path: 'volatilidad/{moneda}/{fecha}'
          method: delete

  horarioMercado:
    handler: src/handlers/horarioMercado.handler.handler
    events:
      - http:
          path: horario-mercado
          method: any
      - http:
          path: 'horario-mercado/{proxy+}'
          method: any

  feriado:
    handler: src/handlers/feriado.handler.handler
    events:
      - http:
          path: feriado
          method: any
      - http:
          path: 'feriado/{proxy+}'
          method: any

  listarRangoImportePN:
    handler: src/handlers/rangoImporte.listarPN
    events:
      - http:
          path: /parametros/rango-importe/pn
          method: get
          cors: true

  crearRangoImportePN:
    handler: src/handlers/rangoImporte.crearPN
    events:
      - http:
          path: /parametros/rango-importe/pn
          method: post
          cors: true

  actualizarRangoImportePN:
    handler: src/handlers/rangoImporte.actualizarPN
    events:
      - http:
          path: /parametros/rango-importe/pn/{id}
          method: put
          cors: true

  eliminarRangoImportePN:
    handler: src/handlers/rangoImporte.eliminarPN
    events:
      - http:
          path: /parametros/rango-importe/pn/{id}
          method: delete
          cors: true

  listarRangoImportePJ:
    handler: src/handlers/rangoImporte.listarPJ
    events:
      - http:
          path: /parametros/rango-importe/pj
          method: get
          cors: true

  crearRangoImportePJ:
    handler: src/handlers/rangoImporte.crearPJ
    events:
      - http:
          path: /parametros/rango-importe/pj
          method: post
          cors: true

  actualizarRangoImportePJ:
    handler: src/handlers/rangoImporte.actualizarPJ
    events:
      - http:
          path: /parametros/rango-importe/pj/{id}
          method: put
          cors: true

  eliminarRangoImportePJ:
    handler: src/handlers/rangoImporte.eliminarPJ
    events:
      - http:
          path: /parametros/rango-importe/pj/{id}
          method: delete
          cors: true

  listarSegmento:
    handler: src/handlers/segmento.listar
    events:
      - http:
          path: /parametros/segmento
          method: get
          cors: true

  crearSegmento:
    handler: src/handlers/segmento.crear
    events:
      - http:
          path: /parametros/segmento
          method: post
          cors: true

  actualizarSegmento:
    handler: src/handlers/segmento.actualizar
    events:
      - http:
          path: /parametros/segmento/{codigoBanca}
          method: put
          cors: true

  eliminarSegmento:
    handler: src/handlers/segmento.eliminar
    events:
      - http:
          path: /parametros/segmento/{codigoBanca}
          method: delete
          cors: true

  listarSpreadLiquidez:
    handler: src/handlers/spreadLiquidez.listar
    events:
      - http:
          path: /parametros/spread-liquidez
          method: get
          cors: true

  actualizarSpreadLiquidez:
    handler: src/handlers/spreadLiquidez.actualizar
    events:
      - http:
          path: /parametros/spread-liquidez/{tipoMercado}/{sentidoOperacion}
          method: put
          cors: true

  spreadCliente:
    handler: src/handlers/spreadCliente.handler
    events:
      - http:
          path: /parametros/spread-cliente
          method: any
      - http:
          path: '/parametros/spread-cliente/{proxy+}'
          method: any

  obtenerTCBase:
    handler: src/handlers/tipoCambio.handler.obtenerBase
    events:
      - http:
          path: /tipo-cambio/base
          method: GET
          cors: true

  editarTCBase:
    handler: src/handlers/tipoCambio.handler.editarBase
    events:
      - http:
          path: /tipo-cambio/base/{parMoneda}
          method: PUT
          cors: true

  auditoriaTCBase:
    handler: src/handlers/tipoCambio.handler.auditoriaBase
    events:
      - http:
          path: /tipo-cambio/base/{parMoneda}/auditoria
          method: GET
          cors: true

  obtenerTCVentanilla:
    handler: src/handlers/tipoCambio.handler.obtenerVentanilla
    events:
      - http:
          path: /tipo-cambio/ventanilla/{parMoneda}
          method: GET
          cors: true

  enviarTCVentanilla:
    handler: src/handlers/tipoCambio.handler.enviarVentanilla
    events:
      - http:
          path: /tipo-cambio/ventanilla/{parMoneda}
          method: POST
          cors: true

  listarParametrosSistema:
    handler: src/handlers/parametroSistema.listar
    events:
      - http:
          path: /parametros/sistema
          method: GET
          cors: true

  actualizarParametroSistema:
    handler: src/handlers/parametroSistema.actualizar
    events:
      - http:
          path: /parametros/sistema/{grupo}/{clave}
          method: PUT
          cors: true

  usuario:
    handler: src/handlers/usuario.handler.handler
    events:
      - http:
          path: usuario
          method: any
      - http:
          path: 'usuario/{proxy+}'
          method: any

  perfil:
    handler: src/handlers/perfil.handler.handler
    events:
      - http:
          path: perfil
          method: any
      - http:
          path: 'perfil/{proxy+}'
          method: any

  listarVolatilidad:
    handler: src/handlers/volatilidad.listar
    events:
      - http:
          path: /parametros/volatilidad
          method: GET
          cors: true

  actualizarVolatilidad:
    handler: src/handlers/volatilidad.actualizar
    events:
      - http:
          path: /parametros/volatilidad/{id}
          method: PUT
          cors: true

  listarHorario:
    handler: src/handlers/horarioMercado.listar
    events:
      - http:
          path: /parametros/horario-mercado
          method: GET
          cors: true

  actualizarHorario:
    handler: src/handlers/horarioMercado.actualizar
    events:
      - http:
          path: /parametros/horario-mercado/{id}
          method: PUT
          cors: true

  listarFeriados:
    handler: src/handlers/feriado.listar
    events:
      - http:
          path: /parametros/feriados
          method: GET
          cors: true

  crearFeriado:
    handler: src/handlers/feriado.crear
    events:
      - http:
          path: /parametros/feriados
          method: POST
          cors: true

  eliminarFeriado:
    handler: src/handlers/feriado.eliminar
    events:
      - http:
          path: /parametros/feriados/{fecha}
          method: DELETE
          cors: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3010
    noPrependStageInUrl: true

plugins:
  - serverless-esbuild
  - serverless-offline
