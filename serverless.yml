service: bif-fx-parameterization-maintenance-svc

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  memorySize: 256
  timeout: 29
  environment:
    DYNAMO_TABLE: tablero-${self:provider.stage}
    STAGE: ${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/tablero-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/tablero-${self:provider.stage}/index/*

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: false

functions:

  # ── VOLATILIDAD ──────────────────────────────────────────
  listarVolatilidad:
    handler: dist/handlers/volatilidad.handler.listar
    events:
      - http:
          path: /parametros/volatilidad
          method: GET
          cors: true

  actualizarVolatilidad:
    handler: dist/handlers/volatilidad.handler.actualizar
    events:
      - http:
          path: /parametros/volatilidad/{id}
          method: PUT
          cors: true

